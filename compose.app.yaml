# Optional overlay: docker compose -f compose.yaml -f compose.app.yaml up --build -d --wait
services:
  migrations:
    image: mini-erp-migrations:local
    build:
      context: .
      target: migrations
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL with hostname db in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    image: mini-erp-app:local
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL with hostname db in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
