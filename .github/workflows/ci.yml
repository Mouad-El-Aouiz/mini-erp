name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mini_erp_ci
          POSTGRES_USER: mini_erp_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp_ci -d mini_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_URL: "http://127.0.0.1:3100"
      BETTER_AUTH_SECRET: "test-only-auth-secret-never-use-in-production-2026"
      TEST_DATABASE_URL: "postgresql://mini_erp_ci:ci_only_password@127.0.0.1:5432/mini_erp_ci?schema=public"
      DATABASE_URL: "postgresql://mini_erp_ci:ci_only_password@127.0.0.1:5432/mini_erp_ci?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify database access
        run: npm run db:check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test authentication end to end
        run: npm run test:e2e
