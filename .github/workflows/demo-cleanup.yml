name: Demo cleanup

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && vars.DEMO_SIGNUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_SETUP_CONFIRM: mini-erp-staging
      DEMO_CLEANUP_CONFIRM: mini-erp-demo-cleanup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/validate-staging-target.ts
      - run: npx prisma generate
      - run: node --conditions=react-server --import tsx scripts/cleanup-demos.ts
