name: Staging delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.STAGING_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    environment:
      name: staging
      url: https://mini-erp-staging.vercel.app

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check whether this commit is still current
        id: current
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [[ "$latest" == "$RELEASE_SHA" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists. Skipping this release."
          fi

      - name: Setup Node.js
        if: steps.current.outputs.release == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies and pinned Vercel CLI
        if: steps.current.outputs.release == 'true'
        run: |
          npm ci
          npm install --global vercel@63.1.0

      - name: Verify and link the staging project
        if: steps.current.outputs.release == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const projectId = "prj_NKMsJ6DhJoIuNaowknPzMA3x60s3";
          const orgId = "team_IdauEtGay9iX11WsrRyYTGwa";

          if (
            process.env.VERCEL_PROJECT_ID !== projectId ||
            process.env.VERCEL_ORG_ID !== orgId ||
            !process.env.VERCEL_TOKEN?.trim()
          ) {
            throw new Error("Invalid or missing staging configuration.");
          }

          const response = await fetch(
            `https://api.vercel.com/v9/projects/${projectId}?teamId=${orgId}`,
            {
              headers: {
                Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              },
              signal: AbortSignal.timeout(20000),
            },
          );

          if (!response.ok) {
            throw new Error("Cannot verify the Vercel staging project.");
          }

          const project = await response.json();

          if (
            project.id !== projectId ||
            project.accountId !== orgId ||
            project.name !== "mini-erp-staging"
          ) {
            throw new Error("The project does not match the staging target.");
          }

          mkdirSync(".vercel", { recursive: true });
          writeFileSync(
            ".vercel/project.json",
            JSON.stringify({ projectId, orgId }),
          );

          console.log("Vercel staging project verified.");
          NODE

      - name: Validate the staging database destination
        if: steps.current.outputs.release == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SETUP_CONFIRM: mini-erp-staging
        run: node --import tsx scripts/validate-staging-target.ts

      - name: Apply committed migrations
        if: steps.current.outputs.release == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node node_modules/prisma/build/index.js migrate deploy

      - name: Deploy a candidate without replacing the stable domain
        if: steps.current.outputs.release == 'true'
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          deployment_url="$(vercel deploy --prod --skip-domain --yes \
            --meta "githubCommitSha=$RELEASE_SHA")"

          DEPLOYMENT_URL="$deployment_url" node --input-type=module <<'NODE'
          const value = process.env.DEPLOYMENT_URL;
          const url = new URL(value);

          if (
            url.protocol !== "https:" ||
            !url.hostname.endsWith(".vercel.app") ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== "/" ||
            url.search ||
            url.hash
          ) {
            throw new Error("Invalid deployment URL.");
          }
          NODE

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify the candidate and publish it
        if: steps.current.outputs.release == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          check_readiness() {
            local origin="$1"

            for attempt in 1 2 3 4 5 6; do
              if vercel curl "$origin/api/health" -- \
                --silent --fail --max-time 20 |
                node --input-type=module -e '
                  let body = "";
                  for await (const chunk of process.stdin) body += chunk;
                  try {
                    process.exit(JSON.parse(body).status === "ok" ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                '
              then
                echo "Application readiness verified."
                return 0
              fi

              if [[ "$attempt" -lt 6 ]]; then
                sleep 5
              fi
            done

            echo "Application readiness failed."
            return 1
          }

          check_readiness "$DEPLOYMENT_URL"

          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$RELEASE_SHA" ]]; then
            echo "A newer main commit exists. Candidate not promoted."
            exit 0
          fi

          vercel promote "$DEPLOYMENT_URL" --yes
          check_readiness "https://mini-erp-staging.vercel.app"

          {
            echo "## Staging delivery"
            echo "Commit: $RELEASE_SHA"
            echo "Candidate: $DEPLOYMENT_URL"
            echo "Stable application readiness verified."
          } >> "$GITHUB_STEP_SUMMARY"